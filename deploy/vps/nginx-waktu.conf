# /etc/nginx/sites-available/waktu
#
# Serves the Kindle board at https://<domain>/waktu/board.php.
# Only board.php is executable; render.php/fetch.php stay CLI-only, and the
# data/, assets/ and out/ directories are never exposed over HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www;
    index board.php;

    access_log /var/log/nginx/waktu.access.log;
    error_log  /var/log/nginx/waktu.error.log;

    # The single web entry point.
    location = /waktu/board.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_read_timeout 60s;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # No other PHP file may run over HTTP.
    location ~ \.php$ {
        return 404;
    }

    # Server-side data and generated files are not public.
    location ^~ /waktu/data/   { deny all; }
    location ^~ /waktu/assets/ { deny all; }
    location ^~ /waktu/out/    { deny all; }

    # Hidden files (.htaccess, .git, ...) are never served.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location = / {
        return 302 /waktu/board.php;
    }
}
